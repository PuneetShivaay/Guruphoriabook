services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guruphoriabook-postgres
    environment:
      POSTGRES_DB: guruphoriabook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - guruphoriabook_pg_data:/var/lib/postgresql/guruphoriabook_pg_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guruphoriabook"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
 guruphoriabook_pg_data: